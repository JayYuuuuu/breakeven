<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品分析｜电商保本计算器</title>
  <style>
    :root{
      --bg:#F5F5F7;              /* Apple system background */
      --card:#FFFFFF;             /* Card surface */
      --ink:#111111;              /* Primary text */
      --muted:#6e6e73;            /* Secondary text (Apple Gray 2) */
      --accent:#007aff;           /* iOS blue */
      --accent-2:#0a84ff;         /* hover */
      --ok:#34c759;               /* Apple green */
      --warn:#ff9f0a;             /* Apple orange */
      --bad:#ff3b30;              /* Apple red */
      --grid: 12px;
      --radius: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg);
      color:var(--ink); font-family:var(--sans);
    }
    header{ padding:24px 24px 0; }
    h1{ margin:0 0 6px 0; font-size:22px; letter-spacing:.3px; }
    .sub{ color:var(--muted); font-size:13px; }
    main{ padding:24px; }
    
    .card{
      background:var(--card);
      border:1px solid #d2d2d7; border-radius:var(--radius);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .card h2{
      font-size:16px; margin:0; padding:14px 16px; border-bottom:1px solid #e5e5ea;
      background: linear-gradient(180deg, #fafafa, #ffffff);
      border-top-left-radius:var(--radius); border-top-right-radius:var(--radius);
    }
    .content{ padding:16px; }
    
    /* 系统参数设置区域 */
    .params-grid{ 
      display:grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap:16px; 
      margin-bottom: 20px;
    }
    .param-group{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label{ font-size:12px; color:var(--muted); display:block; margin:0 0 4px 2px; }
    .input{
      background:#ffffff; border:1px solid #d2d2d7; color:var(--ink);
      border-radius:8px; padding:10px 12px; width:100%;
      outline:none; font-size:14px; font-weight:500;
      box-sizing: border-box;
    }
    .input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,122,255,0.2); }
    .input:disabled{ 
      background:#f8f8f8; 
      color:var(--muted); 
      cursor: not-allowed;
    }
    
    .switch{
      display:inline-flex; align-items:center; gap:8px; background:#ffffff; border:1px solid #d2d2d7; padding:8px 12px; border-radius:8px;
    }
    
    .btn{
      appearance:none; border:0; background:var(--accent); color:white;
      padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; font-size:14px;
      box-shadow: 0 2px 8px rgba(0,122,255,0.24);
    }
    .btn:active{ transform: translateY(1px); filter:brightness(0.95); }
    .btn.secondary{
      background:var(--muted); box-shadow: 0 2px 8px rgba(110,110,115,0.24);
    }
    .btn.small{
      padding: 6px 12px; font-size: 12px;
    }
    
    /* 功能按钮托盘 */
    .tooltray{ 
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; 
      margin-bottom: 20px;
    }
    .tooltray .tag{ margin-right:auto; align-self:center; color:var(--muted); font-size:12px; }
    
    /* 商品表格样式 */
    .products-table-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e5e5ea;
    }
    
    .products-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 13px;
    }
    
    .products-table th {
      background: #f8f8f8;
      padding: 12px 8px;
      text-align: left;
      font-weight: 600;
      color: var(--ink);
      border-bottom: 1px solid #e5e5ea;
      white-space: nowrap;
    }
    
    .products-table td {
      padding: 8px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
    }
    
    .products-table tr:hover {
      background-color: #f8f9fa;
    }
    
    .products-table tr.main-product {
      background-color: #f0f8ff;
    }
    
    .products-table tr.main-product td:first-child::before {
      content: "⭐ ";
      color: #ff9f0a;
    }
    
    /* 表格输入框样式 */
    .table-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
    }
    
    .table-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0,122,255,0.2);
    }
    
    .table-input:disabled {
      background: #f8f8f8;
      color: var(--muted);
    }
    
    /* 多档价格样式 */
    .tier-prices-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .tier-price-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .tier-price-input {
      flex: 1;
      min-width: 60px;
    }
    
    .remove-tier-btn {
      background: var(--bad);
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .remove-tier-btn:hover {
      background: #d32f2f;
    }
    
    .add-tier-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    
    .add-tier-btn:hover {
      background: var(--accent-2);
    }
    
    /* 主推款样式 */
    .main-toggle {
      background: transparent;
      border: 2px solid #d2d2d7;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    
    .main-toggle.active {
      background: var(--warn);
      border-color: var(--warn);
    }
    
    .main-toggle.active::after {
      content: "★";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 12px;
    }
    
    /* 平台选择样式 */
    .platform-select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      background: white;
    }
    
    /* 计算结果显示 */
    .calc-result {
      background: #f8f9fa;
      border: 1px solid #e5e5ea;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      min-width: 60px;
    }
    
    .calc-result.single {
      color: var(--ink);
    }
    
    .calc-result.multi {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .calc-result.multi .result-item {
      background: white;
      border: 1px solid #e5e5ea;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 11px;
    }
    
    /* 消息提示样式 */
    .message-area {
      margin: 16px 0;
    }
    
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 14px;
    }
    
    .message.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    
    .message.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    
    .message.info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
    
    /* 响应式设计 */
    @media (max-width: 1200px) {
      .params-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }
    
    @media (max-width: 768px) {
      .params-grid {
        grid-template-columns: 1fr;
      }
      
      .tooltray {
        justify-content: flex-start;
      }
      
      .products-table-container {
        font-size: 11px;
      }
      
      .table-input, .platform-select {
        font-size: 11px;
        padding: 4px 6px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>商品分析</h1>
    <div class="sub">批量分析商品保本ROI和保本广告占比，支持单一价格和多档价格模式</div>
  </header>

  <main>
    <!-- 系统参数设置 -->
    <section class="card">
      <h2>系统参数设置</h2>
      <div class="content">
        <div class="params-grid">
          <div class="param-group">
            <label>开票成本比例（%）</label>
            <input id="inputTaxRate" class="input" type="number" step="0.01" value="6">
          </div>
          <div class="param-group">
            <label>商品进项税率（%）</label>
            <input id="outputTaxRate" class="input" type="number" step="0.01" value="13">
          </div>
          <div class="param-group">
            <label>平台佣金率（%）</label>
            <input id="platformRate" class="input" type="number" step="0.01" value="5.5">
          </div>
          <div class="param-group">
            <label>物流费</label>
            <input id="shippingCost" class="input" type="number" step="0.01" value="2.8">
          </div>
          <div class="param-group">
            <label>运费险</label>
            <input id="shippingInsurance" class="input" type="number" step="0.01" value="1.5">
          </div>
          <div class="param-group">
            <label>其他成本</label>
            <input id="otherCost" class="input" type="number" step="0.01" value="2.5">
          </div>
          <div class="param-group">
            <label>销项税率（%）</label>
            <input id="salesTaxRate" class="input" type="number" step="0.01" value="13">
          </div>
          <div class="param-group">
            <label>服务费税率（%）</label>
            <input id="serviceVATRate" class="input" type="number" step="0.01" value="6">
          </div>
        </div>
        
        <div style="margin: 20px 0;">
          <span style="color: var(--muted); font-size: 12px; margin-right: 16px;">进货模式：</span>
          <label class="switch"><input type="radio" name="goodsMode" value="canReturn" checked> 进货可退（不分摊）</label>
          <label class="switch"><input type="radio" name="goodsMode" value="cannotReturn"> 进货不可退（分摊）</label>
        </div>
        
        <div class="tooltray">
          <span class="tag">商品管理</span>
          <button class="btn" id="addExample">插入示例</button>
          <button class="btn secondary" id="addRow">添加商品行</button>
          <button class="btn secondary" id="downloadTemplate">下载模板</button>
          <button class="btn secondary" id="importCSV">导入CSV</button>
          <button class="btn" id="analyze">开始分析</button>
        </div>
        
        <!-- 消息提示区域 -->
        <div id="messageArea" class="message-area"></div>
      </div>
    </section>

    <!-- 商品数据表格 -->
    <section class="card">
      <h2>商品数据</h2>
      <div class="content">
        <div class="products-table-container">
          <table class="products-table" id="productsTable">
            <thead>
              <tr>
                <th style="width: 30px;">
                  <input type="checkbox" id="selectAll">
                </th>
                <th>商品名称</th>
                <th>货号</th>
                <th>平台</th>
                <th style="width: 60px;">主推款</th>
                <th>含税售价P</th>
                <th>含税售价（多档）</th>
                <th>进货价（多档）</th>
                <th>退货率（%）</th>
                <th>保本ROI</th>
                <th>保本广告占比</th>
                <th style="width: 60px;">操作</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- 动态生成商品行 -->
            </tbody>
          </table>
        </div>
        
        <div class="tooltray" style="margin-top: 16px;">
          <span class="tag">批量操作</span>
          <button class="btn secondary" id="exportResults">导出结果</button>
          <button class="btn secondary" id="clearAll">清空所有</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    © 2025 Breakeven Calculator · 商品分析功能
  </footer>

  <script type="module">
    // 导入计算引擎和示例数据
    import {
      analyzeProducts, parseProductFromRow, validateProduct,
      generateCSVTemplate, parseCSV, exportAnalysisToCSV
    } from './engine.js';
    
    import {
      getProductExamples, getSystemParamsExample, generateExampleCSV
    } from './product_examples.js';

    const $ = (id) => document.getElementById(id);
    
    // 全局变量
    let products = []; // 商品数据
    let analysisResults = []; // 分析结果
    let systemParams = {}; // 系统参数
    let nextRowId = 1; // 行ID计数器

    // 工具函数
    function valNum(id) {
      const el = $(id);
      const v = parseFloat(el.value);
      return isFinite(v) ? v : 0;
    }
    
    function valRate(id) {
      return valNum(id) / 100;
    }

    function showMessage(message, type = 'info') {
      const messageArea = $('messageArea');
      const messageEl = document.createElement('div');
      messageEl.className = `message ${type}`;
      messageEl.textContent = message;
      
      messageArea.innerHTML = '';
      messageArea.appendChild(messageEl);
      
      // 3秒后自动清除
      setTimeout(() => {
        if (messageEl.parentNode) {
          messageEl.parentNode.removeChild(messageEl);
        }
      }, 3000);
    }

    // 初始化系统参数
    function initSystemParams() {
      const exampleParams = getSystemParamsExample();
      systemParams = { ...exampleParams };
      
      // 设置默认值到输入框
      $('inputTaxRate').value = (exampleParams.inputTaxRate * 100).toFixed(1);
      $('outputTaxRate').value = (exampleParams.outputTaxRate * 100).toFixed(1);
      $('platformRate').value = (exampleParams.platformRate * 100).toFixed(1);
      $('shippingCost').value = exampleParams.shippingCost.toFixed(1);
      $('shippingInsurance').value = exampleParams.shippingInsurance.toFixed(1);
      $('otherCost').value = exampleParams.otherCost.toFixed(1);
      $('salesTaxRate').value = (exampleParams.salesTaxRate * 100).toFixed(1);
      $('serviceVATRate').value = (exampleParams.serviceVATRate * 100).toFixed(1);
    }

    // 更新系统参数
    function updateSystemParams() {
      systemParams = {
        inputTaxRate: valRate('inputTaxRate'),
        outputTaxRate: valRate('outputTaxRate'),
        platformRate: valRate('platformRate'),
        shippingCost: valNum('shippingCost'),
        shippingInsurance: valNum('shippingInsurance'),
        otherCost: valNum('otherCost'),
        salesTaxRate: valRate('salesTaxRate'),
        serviceVATRate: valRate('serviceVATRate'),
        goodsMode: document.querySelector('input[name="goodsMode"]:checked').value
      };
    }

    // 创建商品行
    function createProductRow(product = null) {
      const rowId = nextRowId++;
      const row = document.createElement('tr');
      row.id = `row-${rowId}`;
      row.className = product && product.isMain ? 'main-product' : '';
      
      const isMultiTier = product && product.tierPrices && product.tierPrices.length > 0;
      
      row.innerHTML = `
        <td>
          <input type="checkbox" class="row-checkbox" data-row-id="${rowId}">
        </td>
        <td>
          <input type="text" class="table-input product-name" placeholder="商品名称" 
                 value="${product ? product.name : ''}" data-row-id="${rowId}">
        </td>
        <td>
          <input type="text" class="table-input product-sku" placeholder="货号" 
                 value="${product ? product.sku : ''}" data-row-id="${rowId}">
        </td>
        <td>
          <select class="platform-select" data-row-id="${rowId}">
            <option value="淘宝" ${product && product.platform === '淘宝' ? 'selected' : ''}>淘宝</option>
            <option value="天猫" ${product && product.platform === '天猫' ? 'selected' : ''}>天猫</option>
            <option value="京东" ${product && product.platform === '京东' ? 'selected' : ''}>京东</option>
            <option value="拼多多" ${product && product.platform === '拼多多' ? 'selected' : ''}>拼多多</option>
            <option value="抖音" ${product && product.platform === '抖音' ? 'selected' : ''}>抖音</option>
            <option value="小红书" ${product && product.platform === '小红书' ? 'selected' : ''}>小红书</option>
          </select>
        </td>
        <td>
          <button class="main-toggle ${product && product.isMain ? 'active' : ''}" 
                  data-row-id="${rowId}" onclick="window.toggleMain(${rowId})"></button>
        </td>
        <td>
          <input type="number" class="table-input single-price" placeholder="0.00" step="0.01" 
                 value="${product && product.singlePrice ? product.singlePrice : ''}" 
                 ${isMultiTier ? 'disabled' : ''} data-row-id="${rowId}">
          ${isMultiTier ? '<div style="font-size: 10px; color: var(--muted); margin-top: 2px;">已启用多档售价</div>' : ''}
        </td>
        <td>
          <div class="tier-prices-container" data-row-id="${rowId}">
            ${product && product.tierPrices && product.tierPrices.length > 0 ? 
              product.tierPrices.map(price => `
                <div class="tier-price-item">
                  <input type="number" class="table-input tier-price-input" value="${price}" step="0.01" data-row-id="${rowId}">
                  <button class="remove-tier-btn" onclick="window.removeTierPrice(${rowId}, this)">×</button>
                </div>
              `).join('') : 
              '<button class="add-tier-btn" onclick="window.addTierPrice(${rowId})">+</button>'
            }
          </div>
        </td>
        <td>
          <div class="tier-costs-container" data-row-id="${rowId}">
            ${product && product.tierCosts && product.tierCosts.length > 0 ? 
              product.tierCosts.map(cost => `
                <div class="tier-price-item">
                  <input type="number" class="table-input tier-cost-input" value="${cost}" step="0.01" data-row-id="${rowId}">
                  <button class="remove-tier-btn" onclick="window.removeTierCost(${rowId}, this)">×</button>
                </div>
              `).join('') : 
              '<button class="add-tier-btn" onclick="window.addTierCost(${rowId})">+</button>'
            }
          </div>
        </td>
        <td>
          <input type="number" class="table-input return-rate" placeholder="0.00" step="0.01" 
                 value="${product ? (product.returnRate * 100).toFixed(2) : ''}" data-row-id="${rowId}">
        </td>
        <td>
          <div class="calc-result" data-row-id="${rowId}">—</div>
        </td>
        <td>
          <div class="calc-result" data-row-id="${rowId}">—</div>
        </td>
        <td>
          <button class="btn secondary small" onclick="window.removeRow(${rowId})">删除</button>
        </td>
      `;
      
      return row;
    }

    // 渲染商品表格
    function renderProductsTable() {
      const tbody = $('productsTableBody');
      tbody.innerHTML = '';
      
      if (products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align: center; color: var(--muted); padding: 40px;">暂无商品数据，请添加商品或导入示例数据</td></tr>';
        return;
      }
      
      products.forEach(product => {
        const row = createProductRow(product);
        tbody.appendChild(row);
      });
    }

    // 添加示例商品
    function addExampleProducts() {
      const examples = getProductExamples();
      products = [...examples];
      renderProductsTable();
      showMessage(`已添加 ${examples.length} 个示例商品`, 'success');
    }

    // 添加空行
    function addEmptyRow() {
      const row = createProductRow();
      $('productsTableBody').appendChild(row);
      showMessage('已添加新的商品行', 'info');
    }

    // 全局函数（供HTML调用）
    window.toggleMain = function(rowId) {
      const button = document.querySelector(`[data-row-id="${rowId}"].main-toggle`);
      button.classList.toggle('active');
      
      // 更新行样式
      const row = document.getElementById(`row-${rowId}`);
      if (button.classList.contains('active')) {
        row.classList.add('main-product');
      } else {
        row.classList.remove('main-product');
      }
    };

    window.addTierPrice = function(rowId) {
      const container = document.querySelector(`[data-row-id="${rowId}"].tier-prices-container`);
      const newItem = document.createElement('div');
      newItem.className = 'tier-price-item';
      newItem.innerHTML = `
        <input type="number" class="table-input tier-price-input" placeholder="0.00" step="0.01" data-row-id="${rowId}">
        <button class="remove-tier-btn" onclick="window.removeTierPrice(${rowId}, this)">×</button>
      `;
      
      // 替换加号按钮
      const addBtn = container.querySelector('.add-tier-btn');
      if (addBtn) {
        addBtn.remove();
      }
      container.appendChild(newItem);
      
      // 禁用单一售价输入框
      const singlePriceInput = document.querySelector(`[data-row-id="${rowId}"].single-price`);
      singlePriceInput.disabled = true;
      singlePriceInput.nextElementSibling.style.display = 'block';
      
      // 添加新的加号按钮
      const newAddBtn = document.createElement('button');
      newAddBtn.className = 'add-tier-btn';
      newAddBtn.innerHTML = '+';
      newAddBtn.onclick = () => window.addTierPrice(rowId);
      container.appendChild(newAddBtn);
    };

    window.removeTierPrice = function(rowId, button) {
      const container = button.parentElement.parentElement;
      button.parentElement.remove();
      
      // 如果没有多档价格了，显示加号按钮并启用单一售价
      const tierInputs = container.querySelectorAll('.tier-price-input');
      if (tierInputs.length === 0) {
        container.innerHTML = '<button class="add-tier-btn" onclick="window.addTierPrice(' + rowId + ')">+</button>';
        
        const singlePriceInput = document.querySelector(`[data-row-id="${rowId}"].single-price`);
        singlePriceInput.disabled = false;
        const disabledMsg = singlePriceInput.nextElementSibling;
        if (disabledMsg) disabledMsg.style.display = 'none';
      }
    };

    window.addTierCost = function(rowId) {
      const container = document.querySelector(`[data-row-id="${rowId}"].tier-costs-container`);
      const newItem = document.createElement('div');
      newItem.className = 'tier-price-item';
      newItem.innerHTML = `
        <input type="number" class="table-input tier-cost-input" placeholder="0.00" step="0.01" data-row-id="${rowId}">
        <button class="remove-tier-btn" onclick="window.removeTierCost(${rowId}, this)">×</button>
      `;
      
      // 替换加号按钮
      const addBtn = container.querySelector('.add-tier-btn');
      if (addBtn) {
        addBtn.remove();
      }
      container.appendChild(newItem);
      
      // 添加新的加号按钮
      const newAddBtn = document.createElement('button');
      newAddBtn.className = 'add-tier-btn';
      newAddBtn.innerHTML = '+';
      newAddBtn.onclick = () => window.addTierCost(rowId);
      container.appendChild(newAddBtn);
    };

    window.removeTierCost = function(rowId, button) {
      const container = button.parentElement.parentElement;
      button.parentElement.remove();
      
      // 如果没有多档成本了，显示加号按钮
      const tierInputs = container.querySelectorAll('.tier-cost-input');
      if (tierInputs.length === 0) {
        container.innerHTML = '<button class="add-tier-btn" onclick="window.addTierCost(' + rowId + ')">+</button>';
      }
    };

    window.removeRow = function(rowId) {
      const row = document.getElementById(`row-${rowId}`);
      if (row) {
        row.remove();
        showMessage('商品行已删除', 'info');
      }
    };

    // 收集表格数据
    function collectTableData() {
      const rows = document.querySelectorAll('#productsTableBody tr:not([style*="text-align: center"])');
      const collectedProducts = [];
      
      rows.forEach(row => {
        const rowId = row.id.replace('row-', '');
        
        // 检查是否是多档价格模式
        const tierPrices = Array.from(row.querySelectorAll('.tier-price-input')).map(input => parseFloat(input.value)).filter(v => isFinite(v) && v > 0);
        const tierCosts = Array.from(row.querySelectorAll('.tier-cost-input')).map(input => parseFloat(input.value)).filter(v => isFinite(v) && v > 0);
        
        const singlePriceInput = row.querySelector('.single-price');
        const singlePrice = singlePriceInput.disabled ? null : parseFloat(singlePriceInput.value);
        const singleCost = null; // 单一成本价暂时不支持
        
        const isMultiTier = tierPrices.length > 0 && tierCosts.length > 0;
        
        if (isMultiTier && tierPrices.length !== tierCosts.length) {
          showMessage(`第${rowId}行：多档价格和成本数量不一致`, 'error');
          return;
        }
        
        const product = {
          name: row.querySelector('.product-name').value.trim(),
          sku: row.querySelector('.product-sku').value.trim(),
          platform: row.querySelector('.platform-select').value,
          isMain: row.querySelector('.main-toggle').classList.contains('active'),
          singlePrice: isMultiTier ? null : singlePrice,
          tierPrices: isMultiTier ? tierPrices : [],
          returnRate: parseFloat(row.querySelector('.return-rate').value) / 100,
          singleCost: isMultiTier ? null : singleCost,
          tierCosts: isMultiTier ? tierCosts : []
        };
        
        // 验证数据
        const validation = validateProduct(product);
        if (!validation.isValid) {
          showMessage(`第${rowId}行：${validation.errors.join(', ')}`, 'error');
          return;
        }
        
        collectedProducts.push(product);
      });
      
      return collectedProducts;
    }

    // 开始分析
    function startAnalysis() {
      const collectedProducts = collectTableData();
      
      if (collectedProducts.length === 0) {
        showMessage('请先添加商品数据', 'error');
        return;
      }
      
      updateSystemParams();
      
      try {
        analysisResults = analyzeProducts(collectedProducts, systemParams);
        updateCalculationResults();
        showMessage(`分析完成，共分析 ${collectedProducts.length} 个商品`, 'success');
      } catch (error) {
        showMessage('分析失败: ' + error.message, 'error');
      }
    }

    // 更新计算结果
    function updateCalculationResults() {
      analysisResults.forEach(result => {
        const rowId = result.name; // 这里需要根据实际情况调整
        
        // 更新ROI显示
        const roiCell = document.querySelector(`[data-row-id="${rowId}"] .calc-result`);
        if (result.singleAnalysis) {
          roiCell.innerHTML = result.singleAnalysis.ROI_BE_effective.toFixed(2);
          roiCell.className = 'calc-result single';
        } else if (result.tierAnalysis.length > 0) {
          roiCell.innerHTML = result.tierAnalysis.map(tier => 
            `<div class="result-item">${tier.ROI_BE_effective.toFixed(2)}</div>`
          ).join('');
          roiCell.className = 'calc-result multi';
        }
        
        // 更新广告占比显示
        const adRateCell = roiCell.nextElementSibling;
        if (result.singleAnalysis) {
          adRateCell.innerHTML = (result.singleAnalysis.adRateBE_effective * 100).toFixed(2) + '%';
          adRateCell.className = 'calc-result single';
        } else if (result.tierAnalysis.length > 0) {
          adRateCell.innerHTML = result.tierAnalysis.map(tier => 
            `<div class="result-item">${(tier.adRateBE_effective * 100).toFixed(2)}%</div>`
          ).join('');
          adRateCell.className = 'calc-result multi';
        }
      });
    }

    // 下载CSV模板
    function downloadTemplate() {
      const csvContent = generateExampleCSV();
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = '商品分析模板.csv';
      link.click();
    }

    // 导入CSV文件
    function importCSV() {
      // 创建文件输入元素
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.csv';
      fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
          handleFileUpload(file);
        }
      };
      fileInput.click();
    }

    // 处理文件上传
    function handleFileUpload(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const csvText = e.target.result;
          const csvData = parseCSV(csvText);
          
          if (csvData.length === 0) {
            showMessage('CSV文件格式错误或为空', 'error');
            return;
          }
          
          // 解析商品数据
          const newProducts = [];
          const errors = [];
          
          csvData.forEach((row, index) => {
            const product = parseProductFromRow(row);
            const validation = validateProduct(product);
            
            if (validation.isValid) {
              newProducts.push(product);
            } else {
              errors.push(`第${index + 2}行: ${validation.errors.join(', ')}`);
            }
          });
          
          if (errors.length > 0) {
            showMessage(`导入完成，但有${errors.length}个错误:\n${errors.join('\n')}`, 'error');
          }
          
          if (newProducts.length > 0) {
            products = [...products, ...newProducts];
            renderProductsTable();
            showMessage(`成功导入 ${newProducts.length} 个商品`, 'success');
          }
          
        } catch (error) {
          showMessage('文件解析失败: ' + error.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    // 导出分析结果
    function exportResults() {
      if (analysisResults.length === 0) {
        showMessage('请先进行分析', 'error');
        return;
      }
      
      try {
        const csvContent = exportAnalysisToCSV(analysisResults);
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '商品分析结果.csv';
        link.click();
        showMessage('结果已导出', 'success');
      } catch (error) {
        showMessage('导出失败: ' + error.message, 'error');
      }
    }

    // 清空所有数据
    function clearAll() {
      if (confirm('确定要清空所有商品数据吗？')) {
        products = [];
        analysisResults = [];
        renderProductsTable();
        showMessage('所有数据已清空', 'success');
      }
    }

    // 全选/取消全选
    function toggleSelectAll() {
      const selectAllCheckbox = $('selectAll');
      const rowCheckboxes = document.querySelectorAll('.row-checkbox');
      
      rowCheckboxes.forEach(checkbox => {
        checkbox.checked = selectAllCheckbox.checked;
      });
    }

    // 事件绑定
    document.getElementById('addExample').addEventListener('click', addExampleProducts);
    document.getElementById('addRow').addEventListener('click', addEmptyRow);
    document.getElementById('downloadTemplate').addEventListener('click', downloadTemplate);
    document.getElementById('importCSV').addEventListener('click', importCSV);
    document.getElementById('analyze').addEventListener('click', startAnalysis);
    document.getElementById('exportResults').addEventListener('click', exportResults);
    document.getElementById('clearAll').addEventListener('click', clearAll);
    document.getElementById('selectAll').addEventListener('change', toggleSelectAll);

    // 系统参数变化时自动更新
    document.querySelectorAll('input[type="number"], input[name="goodsMode"]').forEach(el => {
      el.addEventListener('change', updateSystemParams);
    });

    // 初始化
    initSystemParams();
    renderProductsTable();
  </script>
</body>
</html>
