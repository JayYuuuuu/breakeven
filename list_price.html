<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>标价计算｜到手价 ↔ 页面标价</title>
  <style>
    :root{
      --bg:#F5F5F7;
      --card:#FFFFFF;
      --ink:#111111;
      --muted:#6e6e73;
      --accent:#007aff;
      --ok:#34c759;
      --bad:#ff3b30;
      --radius:12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body{ margin:0; background:var(--bg); font-family:var(--sans); color:var(--ink); }
    header{ padding:20px; }
    h1{ margin:0; font-size:22px; }
    .sub{ font-size:13px; color:var(--muted); margin-top:4px; }

    main{ padding:20px; display:grid; gap:20px; }
    .card{
      background:var(--card); border:1px solid #d2d2d7; border-radius:var(--radius);
      box-shadow:0 1px 2px rgba(0,0,0,0.06); padding:16px;
    }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
    label{ font-size:13px; color:var(--muted); }
    input{
      background:#fff; border:1px solid #d2d2d7; border-radius:10px;
      padding:14px 12px; font-size:28px; font-weight:700; width:120px;
      outline:none; text-align:right;
      box-sizing:border-box; max-width:100%;
    }
    input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,122,255,0.2); }
    .btn{
      background:var(--accent); color:#fff; border:0; border-radius:10px;
      padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
    }
    table{ width:100%; border-collapse:collapse; }
    th,td{ padding:10px; border-bottom:1px solid #e5e5ea; text-align:center; }
    th{ background:#fafafa; font-weight:600; font-size:13px; color:var(--muted); }
    .value{ font-size:22px; font-weight:700; font-family:var(--mono); }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:720px){ .grid2{ grid-template-columns:1fr; } }

    /* ==== Two‑pane big layout ==== */
    .lp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:820px){ .lp-grid{ grid-template-columns:1fr; } }
    .lp-pane{ background:var(--card); border:1px solid #e5e5ea; border-radius:16px; padding:14px; }
    .lp-title{ margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; }
    .lp-rows{ display:flex; flex-direction:column; gap:10px; }
    .big-input{ width:100%; background:#fff; border:1px solid #d2d2d7; border-radius:14px; padding:18px 16px; font-size:58px; font-weight:800; text-align:center; box-sizing:border-box; max-width:100%; display:block; }
    .big-output{ width:100%; background:linear-gradient(180deg,#fafafa,#fff); border:1px solid #e5e5ea; border-radius:14px; padding:20px 16px; font-size:58px; font-weight:900; text-align:center; letter-spacing:0.5px; box-sizing:border-box; max-width:100%; display:block; }
    .lp-actions{ margin-top:12px; }
    .lp-row-item{ display:flex; gap:8px; align-items:center; }
    .lp-del{ background:#f2f2f7; border:1px solid #d2d2d7; border-radius:10px; padding:10px 12px; cursor:pointer; font-size:20px; }
    .lp-del:hover{ border-color:#c7c7cc; }

    /* 设置区单行布局 */
    .settings-inline{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .settings-tiers{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .tier-item{ display:flex; gap:8px; align-items:center; }
    .tier-item input{ width:110px; }

    /* 轻量卡片头部操作按钮 */
    .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .ghost-link{ background:transparent; border:0; color:var(--muted); font-size:12px; padding:4px 8px; cursor:pointer; opacity:.35; }
    .ghost-link:hover, .ghost-link:focus{ opacity:.85; text-decoration:underline; }

    /* 轻量“恢复默认”按钮（悬停/聚焦时才显眼） */
    .reset-btn{ appearance:none; border:1px solid #e5e5ea; background:#f2f2f7; color:#111; border-radius:999px; padding:6px 8px; font-size:11px; line-height:1; cursor:pointer; opacity:0.2; transition:opacity .2s ease, border-color .2s ease; }
    .reset-btn:hover{ opacity:1; border-color:#c7c7cc; }
    .lp-row-item:focus-within .reset-btn, .lp-row-item:hover .reset-btn,
    .tier-item:focus-within .reset-btn, .tier-item:hover .reset-btn,
    .settings-inline:focus-within .reset-btn, .settings-inline:hover .reset-btn{ opacity:1; }
  </style>
</head>
<body>
  <header>
    <h1>标价计算</h1>
    <div class="sub">输入目标到手价，实时计算所需页面标价</div>
  </header>

  <main>
    <!-- 优惠设置 -->
    <section class="card">
      <div class="card-head">
        <h2 style="margin:0;font-size:16px;">优惠设置</h2>
        <button class="ghost-link" id="clearStorage" title="清除所有保存的数据">清除数据</button>
      </div>
      <div class="settings-inline">
        <label>立减百分比</label>
        <input id="discountPct" type="number" step="0.01" value="10">
        <span class="muted">例如 10 表示立减 10%</span>
        <label style="margin-left:8px;">满减档位（门槛,减免）</label>
        <div id="tierRows" class="settings-tiers"></div>
        <button class="btn" id="addTierBtn">+ 添加档位</button>
      </div>
    </section>

    <!-- 计算区域（左到手价，右标价） -->
    <section class="card">
      <h2 style="margin:0 0 12px;font-size:16px;">到手价 ↔ 标价</h2>
      <div class="lp-grid">
        <div class="lp-pane">
          <h3 class="lp-title">目标到手价（元）</h3>
          <div id="lpTargets" class="lp-rows"></div>
          <div class="lp-actions"><button class="btn" id="lpAddRow">+ 添加一行</button></div>
        </div>
        <div class="lp-pane">
          <h3 class="lp-title">页面标价（元）</h3>
          <div id="lpResults" class="lp-rows"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 更精确的金额处理：字符串→整数分；避免浮点误差
    function yuanToCents(y){
      const s = String(y ?? '').trim();
      if (!s) return 0;
      const m = s.match(/^(-?)(\d+)(?:\.(\d{0,}))?$/);
      if (!m) return Math.round(Number(s) * 100);
      const sign = m[1] === '-' ? -1 : 1;
      const int = m[2];
      const dec = (m[3] || '').padEnd(2, '0').slice(0, 2);
      return sign * (parseInt(int, 10) * 100 + parseInt(dec || '0', 10));
    }
    function centsToYuan(c){ return (c/100).toFixed(2); }
    function yuanToWu(y){ // 元→万分（1 元 = 10000 wu）
      const s = String(y ?? '').trim();
      if (!s) return 0;
      const m = s.match(/^(-?)(\d+)(?:\.(\d{0,}))?$/);
      if (!m) return Math.round(Number(s) * 10000);
      const sign = m[1] === '-' ? -1 : 1;
      const int = m[2];
      const dec = (m[3] || '').padEnd(4, '0').slice(0, 4);
      return sign * (parseInt(int, 10) * 10000 + parseInt(dec || '0', 10));
    }

    function readDiscountPct(){
      const pctRaw = parseFloat(document.getElementById('discountPct').value)||0;
      return Math.max(0, pctRaw)/100; // return ratio (0.10 means 10%)
    }

    // 立减百分比：点击/聚焦自动全选
    (function(){
      const disc = document.getElementById('discountPct');
      if (disc){
        const sel = ()=> disc.select();
        disc.addEventListener('focus', sel);
        disc.addEventListener('click', sel);
        attachNumericOnly(disc, 2);
        disc.dataset.default = String(disc.value ?? '10');
        attachResetButton(disc, recalcAll);
      }
    })();

    // —— 工具：数字化输入（仅数字和一个小数点），限制小数位 ——
    function sanitizeNumericInput(value, maxDecimals){
      const s = String(value ?? '');
      // 去掉除数字和点以外的字符
      let out = s.replace(/[^\d.]/g, '');
      // 仅保留第一个点
      const firstDot = out.indexOf('.');
      if (firstDot !== -1){ out = out.slice(0, firstDot + 1) + out.slice(firstDot + 1).replace(/\./g, ''); }
      // 小数位裁剪
      if (maxDecimals >= 0 && firstDot !== -1){
        const [a,b=''] = out.split('.');
        out = a + '.' + b.slice(0, maxDecimals);
      }
      // 去掉前导 0 的陷阱（保留 "0."）
      out = out.replace(/^0+(\d)/, '$1');
      return out;
    }

    function attachNumericOnly(el, maxDecimals){
      // 阶段一：按键层面阻止无效字符（-, +, e/E 等）
      el.addEventListener('keydown', (e)=>{
        // 允许的功能键
        const allowedKeys = ['Backspace','Delete','Tab','Enter','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'];
        if (allowedKeys.includes(e.key)) return;
        // 允许组合键（复制/粘贴/全选/撤销等）
        if (e.ctrlKey || e.metaKey) return;
        // 明确禁止的字符
        if (e.key === '-' || e.key === '+' || e.key === 'e' || e.key === 'E') { e.preventDefault(); return; }
        // 小数点：仅允许一个
        if (e.key === '.'){
          if (String(el.value).includes('.')) { e.preventDefault(); }
          return;
        }
        // 数字 0-9 以外的字符都禁止
        if (!/^\d$/.test(e.key)) { e.preventDefault(); }
      });
      // 阶段二：粘贴/输入后的兜底清洗
      el.addEventListener('input', (e)=>{
        const v = sanitizeNumericInput(e.target.value, maxDecimals);
        if (e.target.value !== v){ e.target.value = v; }
      });
    }

    // —— 工具：为输入框添加“恢复默认”按钮 ——
    function attachResetButton(inputEl, onReset){
      // 如果已经有了，不重复加
      if (inputEl._hasReset) return;
      inputEl._hasReset = true;
      if (!inputEl.dataset.default){ inputEl.dataset.default = String(inputEl.value ?? ''); }
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'reset-btn';
      btn.textContent = '恢复';
      btn.addEventListener('click', ()=>{
        inputEl.value = inputEl.dataset.default || '';
        if (typeof onReset === 'function') onReset();
        inputEl.focus(); inputEl.select();
      });
      // 将按钮插到输入后面
      inputEl.insertAdjacentElement('afterend', btn);
    }

    // 折扣+满减后的到手价（按元后四位精度）→ 返回“分”
    function forwardNet(listPriceCents, discountPct, tiers){
      // 价格转为“wu”（1 元 = 10000 wu）以承载四位小数
      const priceWu = listPriceCents * 100; // 因为 1 分 = 100 wu
      const factor = Math.round((1 - discountPct) * 10000);
      let afterWu = Math.floor(priceWu * factor / 10000); // 折扣后，保留到 wu，向下取整

      // 计算最大可用满减（门槛与减免都按 wu 比较/计算）
      let offWu = 0;
      if (Array.isArray(tiers)){
        for (const t of tiers){
          const thrWu = yuanToWu(t.threshold ?? '0');
          const offTWu = yuanToWu(t.off ?? '0');
          if (afterWu >= thrWu) offWu = Math.max(offWu, offTWu);
        }
      }
      const netWu = Math.max(0, afterWu - offWu);
      return Math.floor(netWu / 100); // 回到“分”（舍去超过 2 位的小数）
    }

    // 四位小数精度：返回 net 的 wu（1 元 = 10000 wu），用于超额校验
    function forwardNetWu(listPriceCents, discountPct, tiers){
      const priceWu = listPriceCents * 100; // 1 分 = 100 wu
      const factor = Math.round((1 - discountPct) * 10000);
      let afterWu = Math.floor(priceWu * factor / 10000);
      let offWu = 0;
      if (Array.isArray(tiers)){
        for (const t of tiers){
          const thrWu = yuanToWu(t.threshold ?? '0');
          const offTWu = yuanToWu(t.off ?? '0');
          if (afterWu >= thrWu) offWu = Math.max(offWu, offTWu);
        }
      }
      return Math.max(0, afterWu - offWu);
    }

    // 反解标价（给定 target，到手价）——四位小数精度，并做“超额校正”
    function solveListPrice(targetCents, discountPct, tiers){
      if (!(targetCents > 0)) return 0;
      let lo = targetCents; // 至少不小于目标
      let hi = Math.max(targetCents + 1, targetCents * 2 + 1000);
      // 扩大上界，直到可行
      while (forwardNet(hi, discountPct, tiers) < targetCents){
        hi = Math.floor(hi * 1.5) + 1000;
        if (hi > 1e9) break;
      }
      // 二分：找最小使 net >= target 的标价
      while (lo < hi){
        const mid = Math.floor((lo + hi) / 2);
        const net = forwardNet(mid, discountPct, tiers);
        if (net >= targetCents) hi = mid; else lo = mid + 1;
      }
      let price = lo;
      const targetWu = targetCents * 100; // 目标到手价按 wu 精度
      let netAfterWu = forwardNetWu(price, discountPct, tiers);
      while (price > 0 && netAfterWu > targetWu){
        price -= 1; // 每次减 1 分
        netAfterWu = forwardNetWu(price, discountPct, tiers);
      }
      return price;
    }

    // ===== DOM逻辑 =====
    const tierRows = document.getElementById('tierRows');

    function addTierRow(thresh='', off=''){
      const row=document.createElement('div');
      row.className='tier-item';
      row.innerHTML=`<input type="number" step="0.01" value="${thresh}" placeholder="门槛">
                     <input type="number" step="0.01" value="${off}" placeholder="减免">
                     <button class="btn" type="button">删除</button>`;
      const [inpThr, inpOff] = row.querySelectorAll('input');
      const delBtn = row.querySelector('button');
      // 交互：输入即重算；聚焦自动全选；数字输入限制；恢复默认按钮；自动保存
      [inpThr, inpOff].forEach(el=>{
        el.addEventListener('input', ()=>{
          recalcAll();
          autoSave();
        });
        el.addEventListener('focus', ()=> el.select());
        attachNumericOnly(el, 2);
        attachResetButton(el, ()=>{
          recalcAll();
          autoSave();
        });
      });
      // 设置默认值（若传入空串，则默认值为空）
      inpThr.dataset.default = String(thresh ?? '');
      inpOff.dataset.default = String(off ?? '');
      delBtn.addEventListener('click', ()=>{
        row.remove(); 
        recalcAll();
        autoSave();
      });
      tierRows.appendChild(row);
      recalcAll();
      autoSave(); // 添加档位后自动保存
    }

    function readTiers(){
      const rows = tierRows.querySelectorAll('.tier-item');
      const arr = [];
      rows.forEach(r => {
        const [t, o] = r.querySelectorAll('input');
        arr.push({ threshold: t.value, off: o.value });
      });
      return arr;
    }

    // —— 工具：跟随上一行的小数位 ——
    function followDecimals(prevStr, num){
      const s = String(prevStr ?? '');
      const m = s.match(/\.(\d+)/);
      if (m && m[1]) return Number(num).toFixed(m[1].length);
      return String(Math.round(Number(num))); // 没有小数则四舍五入为整数
    }

    // —— 工具：删除后聚焦上一行（若无，则下一行） ——
    function focusSiblingAfterDelete(containerLeft, removedLeft){
      const items = Array.from(containerLeft.querySelectorAll('.lp-row-item input.big-input'));
      if (items.length === 0) return;
      // 找到最接近被删元素的上一个输入
      const idx = items.findIndex(el => el === removedLeft.querySelector('input.big-input'));
      if (idx > 0) { items[idx-1].focus(); items[idx-1].select(); return; }
      if (idx === 0 && items[0]) { items[0].focus(); items[0].select(); return; }
      // 如果 removedLeft 不在新数组中（正常），则尝试聚焦最后一个
      items[items.length-1].focus(); items[items.length-1].select();
    }

    // —— 工具：删除一行并聚焦相邻 ——
    function deleteRowWithFocus(wrapL, wrapR){
      const containerLeft = document.getElementById('lpTargets');
      const prev = wrapL.previousElementSibling; // 记录上一行
      wrapL.remove(); wrapR.remove();
      recalcAll();
      autoSave(); // 删除后自动保存
      if (prev && prev.querySelector('input.big-input')){
        const inpPrev = prev.querySelector('input.big-input');
        inpPrev.focus(); inpPrev.select();
      } else {
        const first = containerLeft.querySelector('input.big-input');
        if (first){ first.focus(); first.select(); }
      }
    }

    function addTargetRow(val=''){
      const left = document.getElementById('lpTargets');
      const right = document.getElementById('lpResults');

      // —— 自动预填逻辑 ——
      if (val === '' || val == null) {
        const inputs = Array.from(left.querySelectorAll('input.big-input'));
        const n = inputs.length;
        if (n === 1) {
          const v1s = inputs[0].value;
          const v1 = parseFloat(v1s);
          if (isFinite(v1)) val = followDecimals(v1s, v1 + 10);
        } else if (n >= 2) {
          const vLastS = inputs[n-1].value;
          const vPrevS = inputs[n-2].value;
          const vLast = parseFloat(vLastS);
          const vPrev = parseFloat(vPrevS);
          if (isFinite(vLast) && isFinite(vPrev)) {
            const step = vLast - vPrev;
            val = followDecimals(vLastS, vLast + step);
          } else if (isFinite(vLast)) {
            val = followDecimals(vLastS, vLast + 10);
          }
        }
      }

      const wrapL = document.createElement('div');
      const wrapR = document.createElement('div');
      const inp = document.createElement('input');
      const out = document.createElement('div');
      const del = document.createElement('button');

      wrapL.className = 'lp-row-item';
      wrapR.className = 'lp-row-item';
      inp.type = 'number'; inp.step = '0.01'; inp.value = val; inp.placeholder = '输入到手价';
      inp.className = 'big-input';
      // 仅数字输入（两位小数），恢复默认
      attachNumericOnly(inp, 2);
      inp.dataset.default = String(val ?? '');
      attachResetButton(inp, ()=> calcRow(inp, out));
      out.className = 'big-output'; out.textContent = '—';
      del.className = 'lp-del'; del.type = 'button'; del.textContent = '删除';

      // 事件
      inp.addEventListener('focus', ()=> inp.select());
      inp.addEventListener('input', ()=>{
        calcRow(inp, out);
        autoSave();
      });
      inp.addEventListener('keydown', (e)=>{
        if (e.key === 'Enter'){
          const n = addTargetRow('');
          setTimeout(()=> n.focus(), 0);
        } else if (e.key === 'Backspace' && (e.metaKey || e.ctrlKey)){
          e.preventDefault();
          deleteRowWithFocus(wrapL, wrapR);
        }
      });
      del.addEventListener('click', ()=> deleteRowWithFocus(wrapL, wrapR));

      wrapL.appendChild(inp); wrapL.appendChild(del);
      wrapR.appendChild(out);
      left.appendChild(wrapL); right.appendChild(wrapR);
      calcRow(inp, out);
      autoSave(); // 添加行后自动保存
      return inp;
    }

    function calcRow(inputEl, outEl){
      const val = yuanToCents(inputEl.value);
      const discountPct = readDiscountPct();
      const tiers = readTiers();
      const ans = solveListPrice(val, discountPct, tiers);
      outEl.textContent = ans ? centsToYuan(ans) : '—';
    }

    function recalcAll(){
      const left = document.getElementById('lpTargets');
      const rights = Array.from(document.getElementById('lpResults').children);
      Array.from(left.querySelectorAll('input.big-input')).forEach((inp, i)=> calcRow(inp, rights[i].firstChild));
    }

    // ===== 本地存储功能 =====
    
    // 保存数据到本地存储
    function saveToLocalStorage() {
      try {
        const data = {
          discountPct: document.getElementById('discountPct').value,
          tiers: readTiers(),
          targets: Array.from(document.getElementById('lpTargets').querySelectorAll('input.big-input')).map(inp => inp.value)
        };
        localStorage.setItem('listPriceData', JSON.stringify(data));
      } catch (e) {
        console.warn('保存数据失败:', e);
      }
    }
    
    // 从本地存储恢复数据
    function loadFromLocalStorage() {
      try {
        const saved = localStorage.getItem('listPriceData');
        if (saved) {
          const data = JSON.parse(saved);
          
          // 恢复立减百分比
          if (data.discountPct) {
            document.getElementById('discountPct').value = data.discountPct;
          }
          
          // 恢复满减档位
          if (data.tiers && Array.isArray(data.tiers)) {
            // 清空现有档位
            tierRows.innerHTML = '';
            // 添加保存的档位
            data.tiers.forEach(tier => {
              if (tier.threshold || tier.off) {
                addTierRow(tier.threshold, tier.off);
              }
            });
            // 如果没有有效档位，添加一个默认空档位
            if (data.tiers.length === 0 || !data.tiers.some(t => t.threshold || t.off)) {
              addTierRow();
            }
          }
          
          // 恢复目标到手价行
          if (data.targets && Array.isArray(data.targets)) {
            // 清空现有行
            document.getElementById('lpTargets').innerHTML = '';
            document.getElementById('lpResults').innerHTML = '';
            // 添加保存的行
            data.targets.forEach(target => {
              if (target) {
                addTargetRow(target);
              }
            });
            // 如果没有有效行，添加一个默认行
            if (data.targets.length === 0 || !data.targets.some(t => t)) {
              addTargetRow('79.80');
            }
          }
          
          // 重新计算所有结果
          recalcAll();
        }
      } catch (e) {
        console.warn('恢复数据失败:', e);
        // 如果恢复失败，使用默认值
        addTierRow();
        addTargetRow('79.80');
      }
    }
    
    // 自动保存：输入变化时延迟保存
    let saveTimeout;
    function autoSave() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(saveToLocalStorage, 500); // 500ms 延迟保存
    }
    
    // 初始化
    document.getElementById('lpAddRow').addEventListener('click', ()=>{ const el=addTargetRow(''); el.focus(); });
    document.getElementById('addTierBtn').addEventListener('click', ()=> addTierRow());
    
    // 清除本地存储数据
    document.getElementById('clearStorage').addEventListener('click', ()=>{
      if (confirm('确定要清除所有输入的数据吗？此操作不可恢复。')) {
        localStorage.removeItem('listPriceData');
        
        // 重置立减百分比为默认值
        document.getElementById('discountPct').value = '10';
        
        // 清空满减档位，只保留一个空档位
        tierRows.innerHTML = '';
        addTierRow();
        
        // 清空目标到手价行，只保留一个默认行
        document.getElementById('lpTargets').innerHTML = '';
        document.getElementById('lpResults').innerHTML = '';
        addTargetRow('79.80');
        
        // 重新计算
        recalcAll();
      }
    });
    
    // 页面加载时恢复数据
    loadFromLocalStorage();
    
    // 为所有输入框添加自动保存
    document.getElementById('discountPct').addEventListener('input', ()=>{
      recalcAll();
      autoSave();
    });
  </script>
</body>
</html>
