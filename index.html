<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 根路径仅作「入口跳转」，与巨型计算器解耦；计算器见 legacy_calculator.html -->
  <title>电商运营工具箱｜入口</title>
  <script>
    /**
     * 根入口 index.html 行为说明（避免与 README/用户心智冲突）：
     * 1. 默认：直接进入工具箱导航 navigation.html（与站点主导航一致）。
     * 2. 兼容历史书签 index.html?noRedirect=true：转发到 legacy_calculator.html
     *    （原嵌在本文件中的经典单页全功能计算器，已拆出独立文件）。
     */
    (function () {
      var q = new URLSearchParams(window.location.search);
      if (q.has('noRedirect')) {
        window.location.replace('legacy_calculator.html');
      } else {
        window.location.replace('navigation.html');
      }
    })();
  </script>
  <style>
    :root {
      --muted: #6e6e73;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      color: #111;
      font-family: var(--sans);
    }
    .box {
      text-align: center;
      padding: 24px;
      max-width: 28rem;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    a {
      color: #007aff;
    }
  </style>
</head>
<body>
  <div class="box">
    <p>
      正在跳转…若脚本被禁用或长时间无响应，请
      <a href="navigation.html">打开工具箱导航</a>
      或
      <a href="legacy_calculator.html">经典单页计算器</a>。
    </p>
  </div>
</body>
</html>
