<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>链接净化器 · 极简</title>
  <meta name="description" content="输入原始链接，一键生成干净链接，支持复制与跳转。" />
  <style>
    :root{
      --bg: #fbfbfd;
      --card: #ffffff;
      --ink: #111114;
      --muted: #6b7280;
      --accent: #0a84ff; /* iOS 蓝 */
      --ok: #34c759; /* Apple 绿 */
      --ring: rgba(10,132,255,.25);
      --radius: 28px;
      --shadow: 0 30px 60px rgba(0,0,0,.08), 0 8px 20px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg: #0b0b0c;
        --card: #121214;
        --ink: #f5f7fa;
        --muted: #9aa1aa;
        --accent: #0a84ff;
        --ok: #30d158;
        --ring: rgba(10,132,255,.35);
        --shadow: 0 30px 60px rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html,body{height:100%}
    body{
      margin:0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: radial-gradient(1200px 800px at 50% -20%, rgba(10,132,255,.06), transparent 60%), linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0));
      color:var(--ink);
      letter-spacing:.1px;
    }
    .wrap{ max-width: 760px; margin: 10vh auto; padding: 0 24px; }
    header{ text-align:center; margin-bottom: 64px; }
    h1{ font-weight:700; font-size: clamp(32px, 5vw, 56px); letter-spacing:-.2px; line-height:1.08; margin:.2em 0 .1em; }
    .sub{ color:var(--muted); font-size: clamp(16px, 2.2vw, 18px); letter-spacing:.1px; }

    .card{ background: color-mix(in oklab, var(--card) 86%, transparent); backdrop-filter: saturate(160%) blur(16px); border-radius: var(--radius); box-shadow: var(--shadow); padding: 34px; border:1px solid rgba(120,120,128,.12); }
    .stack{ display:flex; flex-direction:column; gap:32px; }

    /* Tab 导航样式 */
    .tab-nav{ 
      display: flex; 
      gap: 8px; 
      margin-bottom: 24px; 
      background: rgba(120,120,128,.08); 
      border-radius: 16px; 
      padding: 4px; 
      border: 1px solid rgba(120,120,128,.12);
    }
    .tab-btn{ 
      flex: 1; 
      appearance: none; 
      border: 0; 
      background: transparent; 
      color: var(--muted); 
      padding: 12px 16px; 
      border-radius: 12px; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all .2s ease;
    }
    .tab-btn.active{ 
      background: var(--card); 
      color: var(--ink); 
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .tab-btn:hover:not(.active){ 
      background: rgba(120,120,128,.12); 
      color: var(--ink);
    }

    /* Tab 内容样式 */
    .tab-content{ 
      display: none; 
    }
    .tab-content.active{ 
      display: block; 
    }

    label{ font-size:14px; color:var(--muted); display:block; margin: 22px 2px 22px; }
    .input, .output{
      width:100%; font-size: clamp(18px, 2.4vw, 22px); line-height:1.45; padding: 22px 24px; border-radius: 18px;
      border:1px solid rgba(120, 120, 128, .16); background: transparent; color:var(--ink);
      outline:none; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder, .output::placeholder{ color: color-mix(in oklab, var(--muted) 70%, transparent); }
    .input:focus{ border-color: var(--accent); box-shadow: 0 0 0 8px var(--ring); }

    .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .btn{
      appearance: none; border:0; cursor:pointer; border-radius: 16px; padding: 16px 22px; font-weight:700;
      font-size:17px; background: var(--ink); color: var(--card); transition: transform .03s ease, box-shadow .2s ease, background .2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{ background: linear-gradient(180deg, rgba(10,132,255,.92), rgba(10,132,255,.84)); }
    .btn.primary.copied{ filter: saturate(120%); }
    .btn.ghost{ background: transparent; color: var(--ink); border:1px solid rgba(120,120,128,.22); }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }

    .meta{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:8px; }
    .pill{ border-radius:12px; padding:8px 10px; border:0; background: rgba(120,120,128,.08); color:var(--muted); font-size:13px; }
    .titlepill{ border-radius:12px; padding:8px 12px; background: rgba(120,120,128,.10); color: var(--ink); font-size:14px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .titlewrap{ display:flex; align-items:center; gap:10px; margin-top:10px; }
    .retry{ appearance:none; border:1px solid rgba(120,120,128,.22); background:transparent; border-radius:10px; padding:6px 10px; font-size:12px; color: var(--muted); cursor:pointer; }
    .retry:disabled{ opacity:.5; cursor:not-allowed; }
    .okdot{ display:inline-flex; width:10px; height:10px; background:var(--ok); border-radius:999px; box-shadow: 0 0 0 8px rgba(48,209,88,.14); margin-right:8px; vertical-align: -1px; }

    details{ background: rgba(120,120,128,.08); border-radius: 14px; padding: 10px 12px; border:1px solid rgba(120,120,128,.12); }
    summary{ cursor: pointer; color: var(--muted); font-size: 13px; }
    code.kv{ display:inline-block; background: rgba(120,120,128,.10); padding: 2px 8px; border-radius: 10px; margin: 4px 6px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }
    .muted{ color: var(--muted); }
    footer{ text-align:center; margin: 28px auto 0; color: color-mix(in oklab, var(--muted) 90%, transparent); font-size: 12px; }
    footer strong{ font-weight:600; }

    .hidden{ display:none !important; }

    .switch{ display:flex; align-items:center; gap:10px; }
    .switch input{ width:38px; height:22px; appearance:none; -webkit-appearance:none; outline:none; border-radius:999px; position:relative; background: rgba(120,120,128,.22); transition: background .2s ease; cursor:pointer; }
    .switch input:checked{ background: var(--accent); }
    .switch input::after{ content:""; position:absolute; width:18px; height:18px; border-radius:50%; left:2px; top:2px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); transition: transform .2s ease; }
    .switch input:checked::after{ transform: translateX(16px); }
    .switch label{ font-size:13px; color: var(--muted); cursor:pointer; }
    
    /* 文本识别工具样式 */
    .area{ width:100%; min-height: 160px; padding:16px 18px; border-radius:16px; border:1px solid rgba(120,120,128,.16); background: transparent; color:var(--ink); font-size:14px; line-height:1.6; outline:none; }
    .area:focus{ border-color: var(--accent); box-shadow: 0 0 0 6px var(--ring); }
    .result-wrap{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .result-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .capsule{ font-size:12px; color:var(--muted); background: rgba(120,120,128,.10); border-radius:999px; padding:6px 10px; }
    .list{ list-style:none; padding:0; margin:0; }
    .list li{ padding:8px 10px; border-radius:10px; border:1px solid rgba(120,120,128,.12); margin-bottom:8px; font-size:14px; }
    .tools-row{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn.small{ padding:10px 14px; font-size:13px; border-radius:12px; }
    .tbl{ width:100%; border-collapse:collapse; margin-top:8px; }
    .tbl th, .tbl td{ border-bottom:1px solid rgba(120,120,128,.12); text-align:left; padding:8px 6px; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>链接净化器</h1>
      <div class="sub">输入原始链接 → 一键生成干净链接。无杂乱参数，重点信息更清晰。</div>
    </header>

    <section class="card">
      <!-- Tab 导航 -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="link-cleaner">🔗 链接净化</button>
        <button class="tab-btn" data-tab="text-extractor">📝 文本识别</button>
      </div>

      <!-- 链接净化 Tab -->
      <div class="tab-content active" id="link-cleaner">
        <div class="stack">
          <div>
            <label for="raw">原始链接</label>
            <input id="raw" class="input" placeholder="粘贴包含一堆追踪参数的链接… 回车生成" autofocus>
          </div>

          <div>
            <label for="clean">干净链接</label>
            <input id="clean" class="output" readonly placeholder="这里将生成净化后的链接…">
            <div class="meta">
              <div class="switch">
                <input type="checkbox" id="keepSku" aria-label="保留 SKU 参数" />
                <label for="keepSku">保留 SKU 参数</label>
              </div>
              <div class="pill" id="status"><span class="okdot hidden" id="okdot"></span><span id="statusText">等待输入…</span></div>
              <div class="row">
                <button class="btn primary" id="copyBtn" disabled>一键复制</button>
                <button class="btn ghost" id="openBtn" disabled>一键跳转 ↗</button>
              </div>
            </div>
            <div class="titlewrap hidden" id="titleWrap">
              <span class="muted">页面标题</span>
              <div class="titlepill" id="pageTitle">正在获取…</div>
              <button class="retry" id="retryTitle">重新获取</button>
            </div>
          </div>

          <details id="detailBox" class="hidden">
            <summary>规则与本次处理结果（可展开查看）</summary>
            <div style="margin-top:8px; font-size:14px">
              <div class="muted" style="margin-bottom:6px">已移除的常见追踪参数示例：</div>
              <div id="knownKeys"></div>
              <div class="muted" style="margin:10px 0 6px">本次从原链接中移除的参数：</div>
              <div id="removedKeys"></div>
            </div>
          </details>
        </div>
      </div>

      <!-- 文本识别 Tab -->
      <div class="tab-content" id="text-extractor">
        <div class="stack">
          <div>
            <label for="bulkInput">粘贴原始文本</label>
            <textarea id="bulkInput" class="area" placeholder="在这里粘贴搜索结果页复制下来的整段文字…"></textarea>
          </div>
          <div class="tools-row">
            <button class="btn small primary" id="extractBtn">识别标题</button>
            <button class="btn small ghost" id="copyTitlesBtn" disabled>复制标题</button>
            <button class="btn small ghost" id="exportCsvBtn" disabled>导出 CSV</button>
            <button class="btn small ghost" id="genFreqBtn" disabled>生成词频</button>
          </div>
          <div class="result-wrap">
            <div class="result-head">
              <div class="capsule"><span id="titleCount">0</span> 条标题</div>
            </div>
            <ul class="list" id="titleList"></ul>
            <div id="freqWrap" class="hidden">
              <div class="capsule">词频 Top 50（去停用词，中文≥2字）</div>
              <table class="tbl" id="freqTable">
                <thead><tr><th>词</th><th>频次</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      小提示：对 <strong>Tmall/Taobao</strong> 商品页仅保留 <code class="kv">id</code>（可选保留 <code class="kv">skuId</code>）；已屏蔽阿里系常见冗余字段（<code class="kv">spm</code>、<code class="kv">scm</code>、<code class="kv">tbpm</code>、<code class="kv">u_channel</code>、<code class="kv">algo*</code> 等）。
    </footer>
  </div>

<script>
(function(){
  // Tab 切换功能
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  function switchTab(tabId) {
    // 移除所有active类
    tabBtns.forEach(btn => btn.classList.remove('active'));
    tabContents.forEach(content => content.classList.remove('active'));
    
    // 添加active类到目标tab
    const targetBtn = document.querySelector(`[data-tab="${tabId}"]`);
    const targetContent = document.getElementById(tabId);
    
    if (targetBtn && targetContent) {
      targetBtn.classList.add('active');
      targetContent.classList.add('active');
    }
  }

  // 绑定tab点击事件
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabId = btn.getAttribute('data-tab');
      switchTab(tabId);
    });
  });

  // 链接净化功能相关元素
  const rawEl   = document.getElementById('raw');
  const cleanEl = document.getElementById('clean');
  const copyBtn = document.getElementById('copyBtn');
  const openBtn = document.getElementById('openBtn');
  const status  = document.getElementById('status');
  const okdot   = document.getElementById('okdot');
  const statusText = document.getElementById('statusText');
  const detailBox  = document.getElementById('detailBox');
  const knownKeysEl = document.getElementById('knownKeys');
  const removedKeysEl = document.getElementById('removedKeys');
  const keepSkuEl = document.getElementById('keepSku');
  const titleWrap = document.getElementById('titleWrap');
  const pageTitleEl = document.getElementById('pageTitle');
  const retryTitleBtn = document.getElementById('retryTitle');

  // 文本识别功能相关元素
  const bulkInput = document.getElementById('bulkInput');
  const extractBtn = document.getElementById('extractBtn');
  const copyTitlesBtn = document.getElementById('copyTitlesBtn');
  const exportCsvBtn = document.getElementById('exportCsvBtn');
  const genFreqBtn = document.getElementById('genFreqBtn');
  const titleList = document.getElementById('titleList');
  const titleCount = document.getElementById('titleCount');
  const freqWrap = document.getElementById('freqWrap');
  const freqTable = document.querySelector('#freqTable tbody');

  // 页面标题获取相关函数
  function fallbackTitle(u){
    try{
      const host = u.hostname.replace(/^www\./,'');
      const params = new URLSearchParams(u.search);
      const id = params.get('id');
      if(/tmall/.test(host)) return id ? `天猫商品（ID: ${id}）` : '天猫商品';
      if(/taobao/.test(host)) return id ? `淘宝商品（ID: ${id}）` : '淘宝商品';
    }catch(_){/* ignore */}
    return '';
  }

  function withTimeout(p, ms=5000){
    return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  }

  async function fetchTitle(url){
    try{
      const u = new URL(url);
      const proxied = `https://r.jina.ai/${u.protocol}//${u.hostname}${u.pathname}${u.search}`;
      const res = await withTimeout(fetch(proxied), 6000);
      if(!res.ok) throw new Error('bad status');
      const txt = await res.text();
      // Heuristic: r.jina.ai returns simplified content; first non-empty line is often the title
      const lines = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      if(lines.length){
        // Prefer a line not starting with 'By ' or '作者'
        const candidate = lines.find(s=>!/^by\s+/i.test(s) && s.length>4) || lines[0];
        return candidate.slice(0,180);
      }
    }catch(e){ /* ignore */ }
    return '';
  }

  // —— 常见追踪参数黑名单（统一转小写后匹配）
  const TRACKING = new Set([
    'utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','utm_referrer',
    'gclid','gbraid','wbraid','dclid','fbclid','msclkid','yclid',
    'spm','scm','pvid','pid','algo_exp_id','algo_pvid','algo_expid','acm','clk1','clk2',
    'ali_refid','ali_trackid','utparam','xxc','mi_id','priceTid','mm_sceneid',
    'mkt_tok','icid','icamp','ref','ref_src','igshid','fb_action_ids','fb_action_types',
    'aff_id','affid','aff','affsource','aff_platform','aff_trace_key','tag',
    'irclickid','clickid','click_id','s_kwcid','mc_eid','mc_cid','_hsenc','_hsmi','from','source',
    'abbucket','forcemini','ns',
    'tbpm','un','u_channel'
  ].map(s=>s.toLowerCase()));

  // —— 按域名的白名单（只保留这些）
  const ALLOW_BY_HOST = {
    'detail.tmall.com': new Set(['id']),
    'detail.tmall.hk': new Set(['id']),
    'item.taobao.com': new Set(['id']),
    'detail.m.tmall.com': new Set(['id']),
    'm.intl.taobao.com': new Set(['id']),
    'chaoshi.detail.tmall.com': new Set(['id']),
    'new-detail.tmall.com': new Set(['id']),
    'new-detail.m.tmall.com': new Set(['id']),
    'www.youtube.com': new Set(['v','t','list','index']),
    'youtu.be': new Set([]), // 短链无需查询参数
    'www.amazon.com': new Set(['psc']),
    'www.amazon.cn': new Set(['psc']),
    'item.jd.com': new Set([]), // JD 商品页通常不需要参数
    'www.jd.com': new Set([])
  };

  // 展示"已知追踪参数"的样例
  knownKeysEl.innerHTML = Array.from(TRACKING).slice(0,24).map(k=>`<code class="kv">${k}</code>`).join('');

  function tryParseUrl(input){
    if(!input) return null;
    let s = String(input).trim();
    // 如果缺协议，尝试补全 https://
    if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try{ return new URL(s); }catch(e){ return null; }
  }

  function cleanUrl(raw){
    const url = tryParseUrl(raw);
    if(!url) return { ok:false, reason:'链接无效', out:'', removed:[] };

    // 归一化：去掉 hash
    url.hash = '';

    const host = url.hostname.replace(/^www\./,'');
    const fullHost = url.hostname; // 用于白名单匹配

    // 复制查询参数并筛选
    const params = new URLSearchParams(url.search);
    const removed = [];

    // 是否命中白名单域名
    let allowSet = ALLOW_BY_HOST[fullHost] || ALLOW_BY_HOST[host] || null;

    // If user wants to keep SKU for Tmall/Taobao, allow it dynamically
    if(allowSet && keepSkuEl.checked){
      allowSet = new Set([...allowSet, 'skuid']);
    }

    // 对 Tmall/Taobao：把 skuId/ID 名统一按小写比较
    const keepParam = (k)=>{
      const key = k.toLowerCase();
      if(key==='skuid' && !keepSkuEl.checked) return false;
      if(allowSet){
        // 白名单：仅保留 allowSet 内的键（大小写不敏感）
        return allowSet.has(key);
      }
      // 非白名单：移除常见追踪参数，其余保留以避免破坏核心语义
      if(key.startsWith('algo')) return false;
      return !TRACKING.has(key);
    };

    // 构建新参数
    const kept = new URLSearchParams();
    for(const [k,v] of params){
      if(keepParam(k)) kept.append(k, v);
      else removed.push(k);
    }

    // 特例：tmall/taobao 若只有 id 则保留；若两者都没有且原链接为 item 页，判定为无效
    if(allowSet){
      const hasAny = Array.from(kept.keys()).length>0;
      if(!hasAny && (host.includes('tmall')||host.includes('taobao'))){
        return { ok:false, reason:'缺少必要的商品参数（id/skuId）', out:'', removed };
      }
    }

    // 生成干净链接
    url.search = kept.toString();

    // 去掉末尾空问号
    const out = url.toString().replace(/\?$/, '');
    return { ok:true, out, removed };
  }

  function render(result){
    if(!result.ok){
      cleanEl.value = '';
      copyBtn.disabled = true; openBtn.disabled = true;
      okdot.classList.add('hidden');
      statusText.textContent = result.reason || '处理失败';
      detailBox.classList.add('hidden');
      removedKeysEl.innerHTML = '';
      titleWrap.classList.add('hidden');
      return;
    }
    cleanEl.value = result.out;
    copyBtn.disabled = false; openBtn.disabled = false;
    okdot.classList.remove('hidden');
    statusText.textContent = '已生成干净链接';
    // Title fetching (best-effort)
    titleWrap.classList.remove('hidden');
    pageTitleEl.textContent = '正在获取…';
    retryTitleBtn.disabled = true;
    if(result.out){
      const u = new URL(result.out);
      fetchTitle(result.out).then(t=>{
        if(t){
          pageTitleEl.textContent = t;
        }else{
          const ft = fallbackTitle(u) || '未获取到标题（站点限制）';
          pageTitleEl.textContent = ft;
        }
      }).catch(()=>{
        const ft = fallbackTitle(u) || '未获取到标题（网络或站点限制）';
        pageTitleEl.textContent = ft;
      }).finally(()=>{
        retryTitleBtn.disabled = false;
      });
    }
    // 细节面板
    detailBox.classList.remove('hidden');
    removedKeysEl.innerHTML = result.removed.length ?
      result.removed.map(k=>`<code class="kv">${k}</code>`).join('') :
      '<span class="muted">（原链接未包含常见追踪参数）</span>';
  }
  retryTitleBtn.addEventListener('click', ()=>{
    const v = cleanEl.value.trim();
    if(!v) return;
    pageTitleEl.textContent = '正在获取…';
    retryTitleBtn.disabled = true;
    const u = new URL(v);
    fetchTitle(v).then(t=>{
      if(t){ pageTitleEl.textContent = t; }
      else{ pageTitleEl.textContent = fallbackTitle(u) || '未获取到标题（站点限制）'; }
    }).catch(()=>{
      pageTitleEl.textContent = fallbackTitle(u) || '未获取到标题（网络或站点限制）';
    }).finally(()=>{ retryTitleBtn.disabled = false; });
  });

  function run(){ render(cleanUrl(rawEl.value)); }

  rawEl.addEventListener('input', ()=>{
    // 实时净化（输入为 URL 时会直接生成）
    const r = cleanUrl(rawEl.value);
    // 只有看起来像 URL 时才展示结果
    if(r.ok){ render(r); } else {
      cleanEl.value = '';
      copyBtn.disabled = true; openBtn.disabled = true;
      okdot.classList.add('hidden');
      statusText.textContent = '等待输入…';
      detailBox.classList.add('hidden');
      removedKeysEl.innerHTML = '';
      titleWrap.classList.add('hidden');
    }
  });

  // 点击输入框时全选内容，方便覆盖输入
  rawEl.addEventListener('click', (e)=>{
    // 如果输入框有内容且不是通过拖拽选择文本，则全选
    if(rawEl.value && !window.getSelection().toString()){
      rawEl.select();
    }
  });

  rawEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      run();
      copyBtn.focus();
    }
  });

  copyBtn.addEventListener('click', async ()=>{
    const v = cleanEl.value.trim();
    if(!v) return;
    try{
      await navigator.clipboard.writeText(v);
      statusText.textContent = '已复制到剪贴板';
      copyBtn.classList.add('copied');
      okdot.style.background = 'var(--ok)';
      setTimeout(()=>{
        statusText.textContent = '已生成干净链接'; 
        okdot.style.background='var(--ok)';
        copyBtn.classList.remove('copied');
      }, 1600);
    }catch{
      // 兼容不支持 Clipboard API 的环境
      cleanEl.select(); document.execCommand('copy');
      statusText.textContent = '已复制（兼容模式）';
      setTimeout(()=>{ statusText.textContent = '已生成干净链接'; }, 1600);
    }
  });

  openBtn.addEventListener('click', ()=>{
    const v = cleanEl.value.trim();
    if(!v) return;
    // 安全起见，仅在 http/https 时跳转
    if(/^https?:\/\//i.test(v)) window.open(v, '_blank', 'noopener,noreferrer');
  });

  // 粘贴即刻处理的体验
  window.addEventListener('paste', () => {
    setTimeout(run, 0); // 等待粘贴完成后再运行
  });

  keepSkuEl.addEventListener('change', () => run());

  // —— 文本识别工具：从纯文本中提取商品标题 ——
  
  // 规则：去领域词依赖，改为"通用打分"抽取标题
  // 仅保留与价格、销量、店铺信息等明显噪声无关且像"商品名"的行
  const NOISE_PATTERNS = [
    /[¥￥]\s*\d/,                 // 价格
    /券后价|补贴|立减|直降|秒杀|抢购|折扣|返现|返\d+元|预售|预定|到手价|神券|神价/, // 营销
    /人付款|人看过|付款|看过|回头客/,   // 成交/浏览
    /包邮|退货宝|公益宝贝|运费险/,       // 服务
    /关注的店|品牌直销店/,               // 引导
    /(旗舰店|官方店|品牌店|自营店|总店|专卖店|专营店|店$)/, // 店铺
    /江苏|浙江|广东|上海|北京|天津|重庆|四川|福建|山东|河南|河北|湖南|湖北|安徽|江西|山西|陕西|黑龙江|吉林|辽宁|云南|贵州|甘肃|内蒙古|宁夏|青海|广西|新疆|西藏|香港|澳门|台湾/, // 地名
    /https?:\/\//i,                 // URL
    /^\s*\d+\s*\/\s*\d+\s*$/,    // 分页指示 1/100
    /^\s*\d+[，,\. ]*\+?人?$/,      // 纯数字/人数
  ];
  const SECTION_NOISE = [
    /^\s*品牌[:：]/, /^\s*工艺[:：]/, /^\s*厚度[:：]/, /^\s*材质[:：]?/,
    /^\s*筛选条件[:：]?/, /^\s*大家都在搜/, /^\s*综合|销量|价格|新品|包邮|百亿补贴|全球购/
  ];

  // 长度阈值：标题一般最多30个中文（约60字符），低于20个中文可忽略
  const MIN_ZH = 20;         // 最少中文字符数
  const MAX_CHARS = 60;      // 展示时的最大字符数（不截断导出原文）

  function zhCount(s){
    const m = String(s).match(/[\u4e00-\u9fa5]/g); return m ? m.length : 0;
  }
  function truncateByChars(s, n){
    if(!s) return s;
    if(s.length <= n) return s;
    return s.slice(0, n) + '…';
  }
  function looksLikeTitleLine(lines, idx){
    const s = (lines[idx]||'').trim();
    if(!s) return {ok:false,score:-9};
    if(SECTION_NOISE.some(re=>re.test(s))) return {ok:false,score:-8};
    if(/[:：]$/.test(s)) return {ok:false,score:-7};
    if (NOISE_PATTERNS.some(re=>re.test(s))) return {ok:false,score:-6};

    const L = s.length;
    const Z = zhCount(s);
    // 硬性规则：中文少于阈值直接忽略
    if (Z < MIN_ZH) return {ok:false,score:-5};

    let score = 0;
    if (Z >= MIN_ZH) score += 2.5;       // 满足中文阈值
    if (L >= 12 && L <= 120) score += 2; // 合理长度
    if (/[A-Za-z0-9]/.test(s)) score += 0.5; // 型号/品牌字母

    // 惩罚：疑似店铺或服务信息
    if (/(旗舰店|官方店|品牌店|自营店|总店|店$)/.test(s)) score -= 3;
    if (/[¥￥]/.test(s)) score -= 3;

    // 上下文加分：下一行价格/销量/发货地
    const next = (lines[idx+1]||'').trim();
    if(next){
      if(/[¥￥]\s*\d/.test(next)) score += 2;
      if(/人付款|券后价|补贴|包邮/.test(next)) score += 1.5;
      if(/江苏|浙江|广东|上海|北京|天津|重庆|四川|福建/.test(next)) score += 1;
    }

    // 前一行若像属性标签，加一点分
    const prev = (lines[idx-1]||'').trim();
    if(prev && /^(男|女|男女通用|A类|B类|长袖|短袖|春秋|秋冬|冬季|夏季)\b/.test(prev)) score += 0.5;

    return {ok: score >= 3, score};
  }

  function dedupe(arr){
    const seen = new Set();
    const out = [];
    for(const t of arr){
      const norm = t.replace(/\s+/g,' ').trim();
      if(!seen.has(norm)) { seen.add(norm); out.push(norm); }
    }
    return out;
  }

  function extractTitlesFromText(text){
    const lines = String(text).split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
    const picked = [];
    for(let i=0;i<lines.length;i++){
      const {ok} = looksLikeTitleLine(lines, i);
      if(ok) picked.push(lines[i]);
    }
    return dedupe(picked);
  }

  let lastTitles = [];
  function renderTitles(titles){
    lastTitles = titles.slice(); // 保存原文用于复制/导出/词频
    const items = titles.map(t=>`<li title="${escapeHtml(t)}">${escapeHtml(truncateByChars(t, MAX_CHARS))}</li>`).join('');
    titleList.innerHTML = items;
    titleCount.textContent = String(titles.length);
    const has = titles.length>0;
    copyTitlesBtn.disabled = !has;
    exportCsvBtn.disabled = !has;
    genFreqBtn.disabled = !has;
    if(!has){ freqWrap.classList.add('hidden'); freqTable.innerHTML=''; }
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function toCSV(titles){
    const header = 'title';
    const rows = titles.map(t => '"' + t.replace(/"/g,'""') + '"');
    return [header, ...rows].join('\n');
  }

  function download(name, text, type='text/plain'){
    const blob = new Blob([text], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  }

  // 简单词频：中文按连续汉字分词，过滤长度<2；英文/数字按 \w+ 提取；常见停用词剔除
  const STOPWORDS = new Set(['儿童','男童','女童','中大童','青少年','男','女','套装','内衣','秋衣','秋裤','睡衣','保暖','打底','纯棉','薄款','加厚','新款','官方','旗舰','品牌','店','总店','自营','正品']);

  function tokenize(t){
    const tokens = [];
    // 中文词块
    const zh = t.match(/[\u4e00-\u9fa5]{2,}/g) || [];
    zh.forEach(w=>tokens.push(w));
    // 英文/数字
    const en = t.match(/[A-Za-z0-9][A-Za-z0-9\-+\/]{1,}/g) || [];
    en.forEach(w=>tokens.push(w.toLowerCase()));
    return tokens;
  }

  function makeFreq(titles){
    const freq = new Map();
    for(const t of titles){
      for(const tok of tokenize(t)){
        if(STOPWORDS.has(tok)) continue;
        if(tok.length < 2) continue;
        freq.set(tok, (freq.get(tok)||0)+1);
      }
    }
    return Array.from(freq.entries()).sort((a,b)=>b[1]-a[1]).slice(0,50);
  }

  function renderFreq(pairs){
    freqTable.innerHTML = pairs.map(([w,c])=>`<tr><td>${escapeHtml(w)}</td><td>${c}</td></tr>`).join('');
    freqWrap.classList.remove('hidden');
  }

  extractBtn.addEventListener('click', ()=>{
    const titles = extractTitlesFromText(bulkInput.value);
    renderTitles(titles);
  });

  copyTitlesBtn.addEventListener('click', async ()=>{
    const text = lastTitles.join('\n');
    try{ await navigator.clipboard.writeText(text); }catch{ /* ignore */ }
  });

  exportCsvBtn.addEventListener('click', ()=>{
    const csv = toCSV(lastTitles);
    download('titles.csv', csv, 'text/csv;charset=utf-8');
  });

  genFreqBtn.addEventListener('click', ()=>{
    renderFreq(makeFreq(lastTitles));
  });
})();
</script>
</body>
</html>
